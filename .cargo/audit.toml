[advisories]
ignore = [
    # Marvin timing side-channel in RSA PKCS#1 v1.5 *decryption*.
    # Pulled by sqlx 0.8's unused MySQL backend (`sqlx-mysql`) which remains
    # in Cargo.lock even with default-features disabled. Goshikq talks only to
    # PostgreSQL and verifies RS256 JWTs (signature verify, not RSA decrypt).
    # No patched `rsa` 0.9 release exists. Revisit when sqlx 0.8 is gone.
    "RUSTSEC-2023-0071",
    # C SQLite CVE-2026-119375 in `libsqlite3-sys` 0.30.1 via unused `sqlx-sqlite`.
    # sqlx 0.8 records optional MySQL/SQLite backends in Cargo.lock even with
    # default-features disabled. Goshikq talks only to PostgreSQL. sqlx 0.8 has
    # no patched sqlite driver; do not compile sqlite into the runtime.
    "RUSTSEC-2026-0459",
]
