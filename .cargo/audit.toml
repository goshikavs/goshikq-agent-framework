[advisories]
ignore = [
    # C SQLite CVE-2026-119375 in `libsqlite3-sys` 0.30.1.
    # sqlx still records optional `sqlx-sqlite` / `sqlx-mysql` crates in Cargo.lock
    # even when those features are disabled. `cargo tree -p goshikq-server -i libsqlite3-sys`
    # prints nothing; CI `scripts/assert_unused_sqlx_backends.py` walks the resolve graph
    # from goshikq-server/cli/storage/runtime and fails if sqlite/mysql become reachable.
    # Goshikq talks only to PostgreSQL. Revisit when sqlx stops listing unused backends
    # in the lockfile. Do not compile the sqlite feature into the runtime.
    "RUSTSEC-2026-0459",
]
# Unmaintained crates (chrono, paste, pin-utils) stay warnings. See
# docs/release/v1.0-security-review.md for the upgrade plan. Do not ignore them.
