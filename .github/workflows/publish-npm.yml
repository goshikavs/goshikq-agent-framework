# Prepared only. Does not run on push or pull request.
# An owner must dispatch it with confirm=PUBLISH and an existing tag.
# The tag must already be on main. The GitHub environment "npm" must have
# a required reviewer and an npm trusted publisher for @goshikq/sdk.
# This file stores no registry token.

name: Publish TypeScript SDK

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to upload. Any other value skips the job.
        required: true
        type: string
      tag:
        description: Existing git tag on main, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event.inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          # Node 22.23.5 bundles npm 10.9.9. Trusted publishing needs npm >= 11.5.1
          # and Node >= 22.14. Node 24.22.3 bundles npm 11.19.1.
          node-version: "24.22.3"
          registry-url: "https://registry.npmjs.org"
      - name: Require the npm trusted-publishing CLI
        run: |
          set -eu
          NPM_VER="$(npm --version)"
          export NPM_VER
          node --input-type=module -e "const [maj,min,pat]=process.env.NPM_VER.split('.').map(Number); const ok=maj>11 || (maj===11 && (min>5 || (min===5 && pat>=1))); if(!ok){console.error('npm', process.env.NPM_VER, 'is below 11.5.1'); process.exit(1)} console.log('node', process.version, 'npm', process.env.NPM_VER);"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Require a main tag whose package version matches
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "$TAG" in
            v1.0.*) ;;
            *) echo "refusing tag $TAG"; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module -e "import fs from 'node:fs'; const v=JSON.parse(fs.readFileSync('sdk/typescript/package.json','utf8')).version; const tag=process.env.TAG; if (tag!=='v'+v && tag!==v) process.exit(1); const [a,b,c]=v.split('.'); if (!(a==='1' && b==='0' && Number(c)>=1)) { console.error('refusing', v); process.exit(1);} fs.appendFileSync(process.env.GITHUB_ENV, 'PACKAGE_VERSION='+v+'\n'); console.log(v, 'matches', tag);"
      - name: Build and inspect the tarball
        run: |
          set -eu
          bun install --frozen-lockfile
          bun --filter @goshikq/sdk build
          test -f sdk/typescript/dist/index.js
          test -f sdk/typescript/dist/index.d.ts
          test -f sdk/typescript/dist/index.js.map
          cd sdk/typescript
          npm pack
          tar -tzf goshikq-sdk-${PACKAGE_VERSION}.tgz | grep -E 'dist/index\.(js|d\.ts)$'
          sha256sum "goshikq-sdk-${PACKAGE_VERSION}.tgz"
          rm -f "goshikq-sdk-${PACKAGE_VERSION}.tgz"
      - name: Refuse an existing npm version
        run: |
          set -eu
          if npm view "@goshikq/sdk@${PACKAGE_VERSION}" version > /tmp/npm-view.out 2> /tmp/npm-view.err; then
            echo "refusing to overwrite @goshikq/sdk@${PACKAGE_VERSION}"
            exit 1
          fi
          if ! grep -q "404" /tmp/npm-view.err; then
            echo "unexpected npm view result"
            cat /tmp/npm-view.err
            exit 1
          fi
      - name: Publish with provenance
        working-directory: sdk/typescript
        run: npm publish --access public --provenance
