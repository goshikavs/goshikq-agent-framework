# Runs the published v1.0.0 installer on GitHub-hosted runners.
# This does not build the runtime from source and does not publish anything.

name: Install smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            kind: unix
            experimental: false
          - name: linux-arm64
            os: ubuntu-24.04-arm
            kind: unix
            experimental: false
          - name: macos-arm64
            os: macos-latest
            kind: unix
            experimental: false
          - name: macos-amd64
            os: macos-15-intel
            kind: unix
            experimental: false
          - name: windows-amd64
            os: windows-latest
            kind: windows
            experimental: false
          - name: windows-arm64
            os: windows-11-arm
            kind: windows
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Install published v1.0.0 and verify an outcome
        if: matrix.kind == 'unix'
        run: sh scripts/install-smoke.sh
      - name: Install published v1.0.0 and verify an outcome
        if: matrix.kind == 'windows'
        shell: pwsh
        run: ./scripts/install-smoke.ps1
